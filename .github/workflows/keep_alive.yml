name: Mantener App Despierta

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  keep_alive:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Ping Supabase REST API
        run: |
          echo "URL: ${SUPABASE_URL:0:40}..."
          echo "KEY: ${SUPABASE_ANON_KEY:0:20}..."
          curl -X GET "${SUPABASE_URL}/rest/v1/" \
            -H "apikey: ${SUPABASE_ANON_KEY}" \
            --fail --silent --show-error
          echo "✅ Supabase pinged successfully"
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}

      - name: Commit vacío para generar actividad
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git commit --allow-empty -m "Ping Supabase + Streamlit"
          git push
