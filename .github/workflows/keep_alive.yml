name: Mantener App Despierta

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  keep_alive:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Ping Supabase REST API
        run: |
          echo "Pingeando Supabase..."
          curl -X GET "${SUPABASE_URL_ACTAS}/rest/v1/" \
            -H "apikey: ${SUPABASE_ANON_KEY_ACTAS}" \
            --fail --silent --show-error
          echo "✅ Supabase pinged successfully"
        env:
          SUPABASE_URL_ACTAS: ${{ secrets.SUPABASE_URL_ACTAS }}
          SUPABASE_ANON_KEY_ACTAS: ${{ secrets.SUPABASE_ANON_KEY_ACTAS }}

      - name: Commit vacío para generar actividad
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git commit --allow-empty -m "Ping Supabase + Streamlit"
          git push
