name: Mantener Supabase y Streamlit Despiertos

on:
  schedule:
    - cron: '0 */2 * * *'
  workflow_dispatch:

jobs:
  keep_alive:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Ping Supabase
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            "https://yjdlzlqedjdevxyjrpsg.supabase.co/rest/v1/padron_deuda_presunta?select=id&limit=1" \
            -H "apikey: ${SUPABASE_ANON_KEY_ACTAS}" \
            -H "Authorization: Bearer ${SUPABASE_ANON_KEY_ACTAS}")
          echo "HTTP status Supabase: $STATUS"
          if [ "$STATUS" != "200" ]; then
            echo "❌ Supabase no respondió correctamente (status $STATUS)"
            exit 1
          fi
          echo "✅ Supabase activo"
        env:
          SUPABASE_ANON_KEY_ACTAS: ${{ secrets.SUPABASE_ANON_KEY_ACTAS }}

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Ping Streamlit App (navegador real)
        run: |
          pip install playwright
          playwright install --with-deps chromium
          python keep_alive_streamlit.py
